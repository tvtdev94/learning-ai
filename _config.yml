# GitHub Pages (Jekyll) build settings.
# Folders starting with "_" (like _work/) are never published.
# Unfinished topic drafts live in the repo but stay off the site until done:
# when a topic is finished, remove it from this list and add its card to index.html.
exclude:
  - PROGRESS.md
  - harness/
  - context-engineering/
  - llm-evaluation/
  - llm-fundamentals/
  - multi-agent-agentic-rag/
  - query-transformation/
