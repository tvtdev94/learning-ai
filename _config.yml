# GitHub Pages (Jekyll) build settings.
# Folders starting with "_" (like _work/) are never published.
# Unfinished topic drafts live in the repo but stay off the site until done:
# topics live in so-tay/<slug>/ (list drafts as "so-tay/<slug>/"); when one is finished,
# remove it from this list and add its card to TOPICS in so-tay/index.html.
exclude:
  - PROGRESS.md
