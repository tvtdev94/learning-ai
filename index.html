<style>
:root{
  --bg:#f3f6fc; --bg-glow:rgba(37,89,184,.14); --surface:#ffffff; --surface-2:#e7edf8; --line:#d1daeb;
  --text:#111729; --muted:#47526a; --accent:#2559b8; --accent-2:#7440b8; --mark:rgba(37,89,184,.16);
  --star:#b06a00; --dust:#7787aa; --link:#9fb0d2; --ring:#bccae4; --focus:#2559b8;
  --shadow:0 1px 2px rgba(17,23,41,.05),0 8px 24px rgba(17,23,41,.07);
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0f1f; --bg-glow:rgba(120,160,255,.16); --surface:#121a31; --surface-2:#19223d; --line:#273356;
    --text:#ebeff8; --muted:#a6b0c6; --accent:#86acff; --accent-2:#b892ff; --mark:rgba(134,172,255,.22);
    --star:#f4c95d; --dust:#8e9cc6; --link:#2c3961; --ring:#2a3660; --focus:#86acff;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0f1f; --bg-glow:rgba(120,160,255,.16); --surface:#121a31; --surface-2:#19223d; --line:#273356;
  --text:#ebeff8; --muted:#a6b0c6; --accent:#86acff; --accent-2:#b892ff; --mark:rgba(134,172,255,.22);
  --star:#f4c95d; --dust:#8e9cc6; --link:#2c3961; --ring:#2a3660; --focus:#86acff;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{position:relative;margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden;display:flex;flex-direction:column}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

/* night sky behind everything */
.sky{position:fixed;inset:-24px;z-index:-1;pointer-events:none;background:radial-gradient(90% 60% at 70% 0%,var(--bg-glow),transparent 65%);translate:var(--sx,0) var(--sy,0);transition:translate .6s var(--ease)}
.sky svg{width:100%;height:100%;display:block}
.sky .d{fill:var(--dust)}
.sky .tw{animation:twinkle 5s ease-in-out infinite}
.sky line{stroke:var(--link);stroke-width:1}
.sky .c{fill:var(--dust)}
.shoot{position:absolute;top:12%;left:-10%;width:140px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--star));opacity:0;rotate:18deg;animation:shoot 11s ease-in 2.5s infinite}
.shoot.s2{top:38%;left:30%;width:100px;rotate:24deg;animation-delay:7.5s;animation-duration:13s}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.95}}
@keyframes shoot{0%{opacity:0;translate:0 0}2%{opacity:1}9%{opacity:0;translate:70vw 22vw}100%{opacity:0;translate:70vw 22vw}}

/* top bar */
.bar{width:100%;max-width:1160px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:8px}
.mono{display:inline-flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.08em;font-size:15px;margin-right:auto}
.mono i{width:10px;height:10px;border-radius:50%;background:var(--star);box-shadow:0 0 0 4px rgba(244,201,93,.18);animation:beat 2.6s var(--ease) infinite}
@keyframes beat{0%,100%{scale:1}50%{scale:1.35}}
.menu{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;text-decoration:none;transition:border-color .2s,translate .2s var(--ease)}
.nav{display:flex;gap:8px}
.menu:hover{border-color:var(--accent);translate:0 -1px}
.menu svg{width:16px;height:16px;transition:translate .2s var(--ease)}
.menu:hover svg{translate:3px 0}
@media (max-width:480px){.bar{gap:6px;padding-inline:12px}.nav{gap:6px}.menu{padding:0 11px}.menu svg{display:none}}
.theme-btn{display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;cursor:pointer;transition:rotate .3s var(--ease),border-color .2s}
.theme-btn:hover{border-color:var(--accent);rotate:-25deg}
.theme-btn svg{width:20px;height:20px}

/* hero */
main{flex:1;width:100%;max-width:1160px;margin:0 auto;padding:4px 16px 32px;display:grid;gap:20px;align-content:start;overflow-x:clip}
.orbit{--size:min(74vw,380px);position:relative;width:var(--size);aspect-ratio:1;margin:0 auto;translate:var(--ox,0) var(--oy,0);transition:translate .5s var(--ease)}
.ring{position:absolute;inset:var(--in);border-radius:50%;border:1px dashed var(--ring);animation:spin var(--dur) linear infinite var(--dir),ringIn 1s var(--ease) var(--delay) both}
.ring::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid transparent;border-top-color:var(--accent);opacity:.7}
.sat{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translateX(calc(var(--size) * var(--r))) rotate(calc(-1 * var(--a)))}
.dot{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--mark)}
.dot.gold{background:var(--star);box-shadow:0 0 0 4px rgba(244,201,93,.2)}
.chip{position:absolute;left:0;top:0;translate:-50% -50%;white-space:nowrap;font-size:13px;font-weight:700;line-height:1;padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);animation:spin var(--dur) linear infinite var(--cdir)}
.chip b{color:var(--accent)}
@keyframes spin{to{rotate:360deg}}
@keyframes ringIn{from{opacity:0;scale:.55}to{opacity:1;scale:1}}

.me{position:absolute;inset:31%;border-radius:50%;animation:pop .9s var(--ease) .15s both;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .4s var(--ease);cursor:pointer;-webkit-tap-highlight-color:transparent}
.me::before,.me::after{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,var(--accent),transparent 28%,var(--star) 50%,transparent 72%,var(--accent-2) 90%,var(--accent));animation:spin 6s linear infinite}
.me::after{inset:-14px;filter:blur(18px);opacity:.55}
.me img{position:relative;z-index:1;display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--surface-2);box-shadow:0 0 0 4px var(--bg)}
.ripple{position:absolute;left:50%;top:50%;width:38%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:2px solid var(--accent);pointer-events:none;animation:ripple 1s var(--ease) forwards}
@keyframes ripple{from{opacity:.9;scale:1}to{opacity:0;scale:2.9}}
@keyframes pop{from{opacity:0;scale:.6}to{opacity:1;scale:1}}

.text{text-align:center}
h1{margin:4px 0 0;font-size:min(11.5vw,72px);line-height:1.1;letter-spacing:-.03em;font-weight:850;white-space:nowrap}
h1 .w{display:inline-block;animation:rise .9s var(--ease) both}
h1 .w:nth-child(1){animation-delay:.35s}h1 .w:nth-child(2){animation-delay:.47s}h1 .w:nth-child(3){animation-delay:.59s}
@keyframes rise{from{opacity:0;translate:0 .45em;rotate:4deg}to{opacity:1;translate:0 0;rotate:0deg}}
.role-box{margin:10px 0 0;min-height:calc(2 * 1.35em + 14px);font-size:18px;display:flex;align-items:flex-start;justify-content:center}
.role{margin:0;max-width:100%;display:inline-flex;align-items:center;gap:10px;font-size:18px;line-height:1.35;font-weight:700;color:var(--muted);padding:6px 14px 6px 12px;border:1px solid var(--line);border-radius:22px;background:var(--surface);animation:rise .8s var(--ease) .7s both}
.role .pulse{width:10px;height:10px;border-radius:50%;background:#3fbf7f;animation:ping 2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(63,191,127,.55)}80%,100%{box-shadow:0 0 0 10px rgba(63,191,127,0)}}
.typed{color:var(--text);min-width:0}
.lang-btn{font:800 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.04em}
.lang-btn:hover{rotate:none;translate:0 -1px}
.caret{display:inline-block;width:2px;height:1.1em;margin-left:-6px;vertical-align:-.15em;background:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bio{margin:18px auto 0;max-width:36ch;font-size:18px;line-height:1.65;text-wrap:pretty;animation:rise .8s var(--ease) .85s both}
.contact{animation:rise .7s var(--ease) 1s both}
.bio mark{color:inherit;font-weight:700;background:linear-gradient(var(--mark),var(--mark)) no-repeat 0 85%/0% 45%;animation:hl .9s var(--ease) 1.6s forwards;padding:0 2px;border-radius:3px}
@keyframes hl{to{background-size:100% 45%}}

/* contact */
.contact{text-align:center}
.dock{list-style:none;margin:0;padding:0;display:flex;justify-content:center;gap:12px}
.dock a{position:relative;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:translate .25s var(--ease),background-color .25s,border-color .25s}
.dock svg{width:22px;height:22px;fill:var(--accent);transition:fill .25s}
.dock a:hover,.dock a:focus-visible{translate:0 -4px;background:var(--accent);border-color:var(--accent)}
.dock a:hover svg,.dock a:focus-visible svg{fill:var(--bg)}
.dock a::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;translate:-50% 4px;white-space:nowrap;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--text);color:var(--bg);opacity:0;pointer-events:none;transition:opacity .2s,translate .2s var(--ease)}
.dock a:hover::after,.dock a:focus-visible::after{opacity:1;translate:-50% 0}
.handles{margin:12px 0 0;font-size:15px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px}
.handles span{user-select:all}

/* multiplayer cursors that assemble the page on load */
.cursors{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.cur{position:absolute;left:0;top:0;opacity:0;will-change:transform,opacity}
.cur svg{display:block;width:22px;height:22px;fill:var(--cc);stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.cur span{position:absolute;left:16px;top:18px;white-space:nowrap;font-size:12px;font-weight:700;line-height:1;color:#fff;background:var(--cc);padding:5px 8px;border-radius:999px 999px 999px 4px}
.burst{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:2px solid;opacity:0}
.grab{outline:2px solid var(--gc);outline-offset:6px;border-radius:14px}
.me.grab{border-radius:50%;outline-offset:12px}
.asm .me,.asm h1 .w,.asm .role,.asm .bio,.asm .contact{animation:none}
.asm .bio mark{animation:none}
.replay{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 4px;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.replay:hover{color:var(--text)}
.replay[hidden]{display:none}

footer{width:100%;max-width:1160px;margin:0 auto;padding:8px 16px 28px;color:var(--muted);font-size:14px;text-align:center}

@media (min-width:960px){
  .bar{padding:20px 32px}
  main{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"text orbit" "contact orbit";align-content:center;column-gap:56px;row-gap:36px;padding:8px 32px 40px}
  .text{grid-area:text;text-align:left;align-self:end}
  .orbit{--size:min(40vw,470px);grid-area:orbit;align-self:center}
  .contact{grid-area:contact;align-self:start}
  .contact{text-align:left}
  .dock,.handles{justify-content:flex-start}
  .bio{margin-left:0;font-size:19px}
  h1{font-size:min(5.6vw,72px)}
  .role-box{min-height:0;justify-content:flex-start}
  footer{text-align:left;padding:8px 32px 32px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .shoot,.caret{display:none}
  .bio mark{background-size:100% 45%}
}
</style>
</head>

<script>
(function(){
  var root=document.documentElement;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Theme toggle: the new theme grows out of the button as a circle where View Transitions exist.
  var btn=document.getElementById('themeBtn');
  btn.addEventListener('click',function(){
    var cur=root.getAttribute('data-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    var next=cur==='dark'?'light':'dark';
    function apply(){root.setAttribute('data-theme',next);try{localStorage.setItem('rag-theme',next)}catch(e){}}
    if(!document.startViewTransition||reduce){apply();return}
    var b=btn.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2,r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
    document.startViewTransition(apply).ready.then(function(){
      root.animate({clipPath:['circle(0px at '+x+'px '+y+'px)','circle('+r+'px at '+x+'px '+y+'px)']},{duration:650,easing:'cubic-bezier(.22,1,.36,1)',pseudoElement:'::view-transition-new(root)'});
    }).catch(function(){});
  });

  // Star field: seeded so it looks the same on every visit.
  var NS='http://www.w3.org/2000/svg',seed=11;
  function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
  function el(tag,a,p){var n=document.createElementNS(NS,tag);for(var k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n}
  var svg=el('svg',{viewBox:'0 0 1000 1000',preserveAspectRatio:'xMidYMid slice'},document.getElementById('sky'));
  for(var i=0;i<140;i++){
    var c=el('circle',{'class':'d',cx:(rnd()*1000).toFixed(0),cy:(rnd()*1000).toFixed(0),r:(0.8+rnd()*1.6).toFixed(1),opacity:(0.15+rnd()*0.45).toFixed(2)},svg);
    if(i%6===0){c.setAttribute('class','d tw');c.style.animationDelay=(rnd()*5).toFixed(2)+'s'}
  }
  [[90,120],[760,80],[820,640],[120,760]].forEach(function(o){
    var pts=[],x=o[0],y=o[1];
    for(var k=0;k<5;k++){pts.push([x,y]);x+=40+rnd()*70;y+=(rnd()-.4)*90}
    for(k=1;k<pts.length;k++)el('line',{x1:pts[k-1][0],y1:pts[k-1][1],x2:pts[k][0],y2:pts[k][1]},svg);
    pts.forEach(function(p){el('circle',{'class':'c',cx:p[0],cy:p[1],r:3},svg)});
  });

  // Type the role out; the full text stays in a screen-reader copy.
  var typed=document.getElementById('typed'),full=typed.textContent,typeTimer=0;
  // Roles cycle like a typewriter. Edit ROLES (and the screen-reader copy in .role) to change them.
  var ROLES={
    vi:[full,'Xây dựng AgentKit','Giải pháp tăng hiệu quả và năng suất AI','Xây hệ thống AI','Học RAG và agent','Viết Sổ tay học tập'],
    en:['Software developer','Building AgentKit','Solutions for AI efficiency and productivity','Building AI systems','Learning RAG and agents','Writing a learning notebook']
  },lang='vi';
  function typeRole(delay){
    clearTimeout(typeTimer);typed.textContent='';var r=0,n=0,back=false;
    function step(){
      var list=ROLES[lang],w=list[r%list.length];
      if(!back){typed.textContent=w.slice(0,++n);if(n<w.length){typeTimer=setTimeout(step,70);return}back=true;typeTimer=setTimeout(step,1900);return}
      typed.textContent=w.slice(0,--n);if(n>0){typeTimer=setTimeout(step,35);return}
      back=false;r=(r+1)%list.length;typeTimer=setTimeout(step,320);
    }
    typeTimer=setTimeout(step,delay);
  }

  // Tap the avatar for a ripple.
  var me=document.getElementById('me'),orbit=document.getElementById('orbit');
  me.addEventListener('click',function(){
    if(reduce)return;
    var r=document.createElement('span');r.className='ripple';orbit.appendChild(r);
    r.addEventListener('animationend',function(){r.remove()});
  });

  // Language: the Vietnamese text lives in the HTML, English strings live here.
  // ?lang=en links straight to the English profile; the choice is remembered on this device.
  var EN={
    title:'Trần Văn Tuấn · Software developer',nav:'Pages',notebook:'Notebook',products:'Products',theme:'Toggle light/dark theme',
    alt:'Photo of Trần Văn Tuấn',chipCode:'Programming',chipLife:'Life',contact:'Contact',replay:'Replay the build',
    bio:'This is where I write down what I learn: <mark>AI, programming and life</mark>.'
  };
  var VI={title:document.title},langBtn=document.getElementById('langBtn'),roleSr=document.getElementById('roleSr');
  var nodes=document.querySelectorAll('[data-t],[data-t-html],[data-t-aria],[data-t-alt]');
  [].forEach.call(nodes,function(e){
    if(e.dataset.t)VI[e.dataset.t]=e.textContent;
    if(e.dataset.tHtml)VI[e.dataset.tHtml]=e.innerHTML;
    if(e.dataset.tAria)VI[e.dataset.tAria]=e.getAttribute('aria-label');
    if(e.dataset.tAlt)VI[e.dataset.tAlt]=e.getAttribute('alt');
  });
  function setLang(l){
    lang=l;var D=l==='en'?EN:VI;
    root.lang=l;document.title=D.title;
    [].forEach.call(nodes,function(e){
      if(e.dataset.t)e.textContent=D[e.dataset.t];
      if(e.dataset.tHtml)e.innerHTML=D[e.dataset.tHtml];
      if(e.dataset.tAria)e.setAttribute('aria-label',D[e.dataset.tAria]);
      if(e.dataset.tAlt)e.setAttribute('alt',D[e.dataset.tAlt]);
    });
    roleSr.textContent=ROLES[l].join('. ')+'.';
    langBtn.textContent=l==='en'?'VI':'EN';langBtn.lang=l==='en'?'vi':'en';
    langBtn.setAttribute('aria-label',l==='en'?'Chuyển sang tiếng Việt':'Switch to English');
  }
  var q=/[?&]lang=(en|vi)\b/.exec(location.search),saved=null;
  try{saved=localStorage.getItem('profile-lang')}catch(e){}
  setLang(q?q[1]:(saved==='en'?'en':'vi'));
  langBtn.addEventListener('click',function(){
    var next=lang==='en'?'vi':'en';
    function apply(){
      setLang(next);
      var m=document.querySelector('.bio mark');if(m)m.style.backgroundSize='100% 45%';
      typed.textContent=ROLES[next][0];if(!reduce)typeRole(900);
    }
    try{localStorage.setItem('profile-lang',next)}catch(e){}
    history.replaceState(null,'',next==='en'?'?lang=en':location.pathname);
    if(document.startViewTransition&&!reduce)document.startViewTransition(apply);else apply();
  });

  // Four cursors assemble the page on open: each drags pieces from scattered spots into place.
  var layer=document.getElementById('cursors'),replay=document.getElementById('replay'),running=[],timers=[];
  var CUR=[{name:'Agent 1',color:'#2f6fe0'},{name:'Agent 2',color:'#8b4fd8'},{name:'Agent 3',color:'#0f8a5f'},{name:'Agent 4',color:'#c2410c'}];
  var EASE='cubic-bezier(.22,1,.36,1)',INOUT='cubic-bezier(.65,0,.35,1)',APPROACH=450,PRESS=100,MOVE=600;
  function later(fn,ms){timers.push(setTimeout(fn,ms))}
  function stop(){running.forEach(function(a){a.cancel()});running=[];timers.forEach(clearTimeout);timers=[];layer.textContent='';document.querySelectorAll('.grab').forEach(function(e){e.classList.remove('grab')})}
  function pt(el,fx,fy){var r=el.getBoundingClientRect();return {x:r.left+scrollX+r.width*fx,y:r.top+scrollY+r.height*fy}}
  function burst(x,y,color,at){
    var b=document.createElement('span');b.className='burst';b.style.cssText='left:'+x+'px;top:'+y+'px;border-color:'+color;layer.appendChild(b);
    running.push(b.animate([{opacity:0,scale:.2,offset:0},{opacity:.9,scale:.3,offset:.05},{opacity:0,scale:2.4}],{duration:520,delay:at,easing:EASE,fill:'both'}));
  }
  function assemble(){
    stop();replay.hidden=true;typed.textContent='';
    var vw=document.documentElement.clientWidth,vh=innerHeight,Q=function(q){return document.querySelector(q)};
    var w=document.querySelectorAll('h1 .w'),ic=document.querySelectorAll('.dock a'),mark=Q('.bio mark');
    // [cursor, element, grab x, grab y (fractions of the box), offset x, offset y, rotate, start ms]
    var plan=[
      [0,me,.5,.5,-60,46,-10,150],[1,w[0],.5,.55,-50,70,-12,250],[3,ic[0],.5,.5,-40,90,-20,400],[2,Q('.role'),.18,.5,70,-34,-7,600],
      [3,ic[1],.5,.5,30,110,15,1250],[1,w[1],.5,.55,40,-60,9,1300],[0,Q('.nav'),.2,.5,-50,40,-6,1600],[2,Q('.bio'),.12,.3,-30,60,3,1950],
      [3,ic[2],.5,.5,-20,100,-18,2100],[1,w[2],.5,.55,60,80,-8,2350],[3,ic[3],.5,.5,50,80,22,2950],[0,Q('.handles'),.3,.5,40,50,4,2950]
    ];
    // Measure everything before any piece moves.
    plan.forEach(function(p){p.g=pt(p[1],p[2],p[3])});
    var mr=mark.getClientRects(),ma=mr[0],mb=mr[mr.length-1];
    var paths=[[{t:0,x:-40,y:scrollY+vh*.75,s:1,o:0}],[{t:0,x:vw+40,y:scrollY+vh*.35,s:1,o:0}],[{t:0,x:vw*.75,y:scrollY-40,s:1,o:0}],[{t:0,x:vw*.3,y:scrollY+vh+40,s:1,o:0}]];
    var lastEnd=0;
    plan.forEach(function(p){
      var c=p[0],el=p[1],g=p.g,dx=p[4],dy=p[5],T=p[7],grabAt=T+APPROACH,dropAt=grabAt+PRESS+MOVE;
      paths[c].push({t:grabAt,x:g.x+dx,y:g.y+dy,s:1,o:1,e:INOUT},{t:grabAt+PRESS,x:g.x+dx,y:g.y+dy,s:.8,o:1},{t:dropAt,x:g.x,y:g.y,s:.8,o:1,e:EASE},{t:dropAt+100,x:g.x,y:g.y,s:1,o:1});
      var start='translate('+dx+'px,'+dy+'px) rotate('+p[6]+'deg)';
      running.push(el.animate([{transform:start,offset:0},{transform:start,offset:grabAt/dropAt},{transform:start+' scale(1.05)',offset:(grabAt+PRESS)/dropAt,easing:EASE},{transform:'none',offset:1}],{duration:dropAt}));
      later(function(){el.style.setProperty('--gc',CUR[c].color);el.classList.add('grab')},grabAt);
      later(function(){el.classList.remove('grab');running.push(el.animate([{scale:1.04},{scale:1}],{duration:260,easing:EASE}))},dropAt);
      burst(g.x,g.y,CUR[c].color,dropAt);
      if(el.classList.contains('role'))later(function(){typeRole(0)},dropAt+120);
      lastEnd=Math.max(lastEnd,dropAt+100);
    });
    // Agent 2 finishes by highlighting the topics in the bio like selecting text.
    var sx=ma.left+scrollX,sy=ma.top+scrollY+ma.height*.6,ex=mb.right+scrollX,ey=mb.top+scrollY+mb.height*.6,S=paths[1][paths[1].length-1].t+350;
    paths[1].push({t:S,x:sx,y:sy,s:1,o:1,e:INOUT},{t:S+PRESS,x:sx,y:sy,s:.8,o:1},{t:S+900,x:ex,y:ey,s:.8,o:1,e:INOUT},{t:S+1000,x:ex,y:ey,s:1,o:1});
    running.push(mark.animate([{backgroundSize:'0% 45%'},{backgroundSize:'0% 45%',offset:(S+PRESS)/(S+900)},{backgroundSize:'100% 45%'}],{duration:S+900,fill:'forwards'}));
    lastEnd=Math.max(lastEnd,S+1000);
    // Park, then fade out.
    paths.forEach(function(path,c){
      var l=path[path.length-1],total=lastEnd+1300;
      path.push({t:lastEnd+500,x:l.x+(c-1.5)*20,y:l.y+28,s:1,o:1,e:EASE},{t:total,x:l.x+(c-1.5)*20,y:l.y+28,s:1,o:0});
      var el=document.createElement('div');el.className='cur';el.style.setProperty('--cc',CUR[c].color);
      el.innerHTML='<svg viewBox="0 0 24 24"><path d="M3 2l17 9.5-7.4 1.9L9 21z"/></svg><span>'+CUR[c].name+'</span>';
      layer.appendChild(el);
      running.push(el.animate(path.map(function(wp,i){return {offset:wp.t/total,opacity:wp.o,transform:'translate('+wp.x.toFixed(1)+'px,'+wp.y.toFixed(1)+'px) scale('+wp.s+')',easing:(path[i+1]&&path[i+1].e)||'linear'}}),{duration:total,fill:'forwards'}));
    });
    later(function(){layer.textContent='';replay.hidden=false},lastEnd+1400);
  }
  replay.addEventListener('click',function(){scrollTo({top:0});root.classList.add('asm');requestAnimationFrame(assemble)});
  // The scene always plays on open (it starts from the top); reduced motion skips it.
  if(root.classList.contains('asm')){
    if('scrollRestoration' in history)history.scrollRestoration='manual';
    scrollTo(0,0);requestAnimationFrame(assemble);
  }else typed.textContent=ROLES[lang][0];

  // Mouse parallax: sky drifts one way, orbit the other, avatar tilts toward the pointer.
  if(!reduce&&window.matchMedia('(pointer: fine)').matches){
    var sky=document.getElementById('sky'),px=0,py=0,queued=false;
    addEventListener('pointermove',function(e){
      px=e.clientX/innerWidth*2-1;py=e.clientY/innerHeight*2-1;
      if(queued)return;queued=true;
      requestAnimationFrame(function(){
        queued=false;
        sky.style.setProperty('--sx',(-px*14).toFixed(1)+'px');sky.style.setProperty('--sy',(-py*14).toFixed(1)+'px');
        orbit.style.setProperty('--ox',(px*10).toFixed(1)+'px');orbit.style.setProperty('--oy',(py*10).toFixed(1)+'px');
        me.style.setProperty('--ry',(px*14).toFixed(1)+'deg');me.style.setProperty('--rx',(-py*14).toFixed(1)+'deg');
      });
    });
  }
})();
</script>
