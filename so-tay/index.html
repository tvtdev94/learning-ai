<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ tay</title>
<!-- pwa -->
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">

<script>try{var t=localStorage.getItem('rag-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{
  --bg:#f7f6f2; --surface:#ffffff; --surface-2:#f0eee8; --text:#1f2328; --muted:#5b6370;
  --border:#dcd8cf; --accent:#2559b8; --accent-soft:#e3ecfc; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --surface:#1d2024; --surface-2:#252930; --text:#e6e8eb; --muted:#9aa3ae;
    --border:#333841; --accent:#6b9cf5; --accent-soft:#1f2c45; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1d2024; --surface-2:#252930; --text:#e6e8eb; --muted:#9aa3ae;
  --border:#333841; --accent:#6b9cf5; --accent-soft:#1f2c45; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
main{max-width:900px;margin:0 auto;padding:24px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:clamp(28px,6vw,40px);margin:8px 0 4px;line-height:1.2}
.lead{color:var(--muted);margin:0 0 24px}
.theme-btn{min-width:40px;min-height:40px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
a.topic{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
a.topic:hover,a.topic:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
.topic .icon{font-size:28px;line-height:1}
.topic h2{font-size:20px;margin:10px 0 4px}
.topic p{margin:0;color:var(--muted);font-size:15px}
.topic .meta{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.dim{background:var(--surface-2);color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{min-height:40px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 16px;font:inherit;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#15171a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#15171a}}
[hidden]{display:none!important}
.empty{color:var(--muted)}
.back{display:inline-flex;align-items:center;min-height:40px;color:var(--accent);font-weight:600;text-decoration:none}
.back:hover{text-decoration:underline}
.topic .go{margin-top:12px;color:var(--accent);font-weight:600;font-size:14px}
footer{color:var(--muted);font-size:14px;margin-top:32px}
/* graph view */
:root{--g-code:#16703d;--g-life:#8f4c0a;--edge:#c9ced8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g-code:#4cc184;--g-life:#e39a4f;--edge:#3a414c}}
:root[data-theme="dark"]{--g-code:#4cc184;--g-life:#e39a4f;--edge:#3a414c}
.brain{position:relative;height:clamp(340px,min(62vh,118vw),560px);background:var(--surface) radial-gradient(var(--border) 1px,transparent 1.3px) 0 0/22px 22px;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.brain svg{display:block;width:100%;height:100%;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.brain .lk{stroke:var(--edge);stroke-width:1.2;transition:stroke .2s,opacity .2s}
.brain .lk.hi{stroke:var(--accent);stroke-width:2}
.brain.focus .lk:not(.hi),.brain .lk.off{opacity:.15}
.brain .nd{transition:opacity .2s}
.brain .nd circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.brain .nd.code circle{fill:var(--g-code)}.brain .nd.life circle{fill:var(--g-life)}
.brain .nd.sel circle:not(.ping){stroke:var(--text);stroke-width:3}
.brain .nd text{font:600 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--text);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round;opacity:0;transition:opacity .2s;pointer-events:none}
.brain .nd.lab text{opacity:1}
.brain.focus .nd:not(.hi){opacity:.22}
.brain .nd.off{opacity:.1}
.brain .ping{fill:none!important;stroke:var(--accent)!important;stroke-width:2!important;transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{opacity:.8;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.8)}}
.brain-ctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.brain-ctl button{width:40px;height:40px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;font:600 18px/1 system-ui,sans-serif;cursor:pointer}
.brain-ctl button:hover{border-color:var(--accent);color:var(--accent)}
.brain-info{margin:12px 0 28px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;min-height:72px}
.brain-info h3{margin:0;font-size:19px;line-height:1.3}
.brain-info p{margin:4px 0 0;color:var(--muted);font-size:15px}
.brain-info .sum{margin:0}.brain-info .sum b{color:var(--text)}
.brain-info .rel-k{margin-top:12px;font-weight:600}
.rel{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rel button{min-height:40px;padding:0 12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.rel button:hover{border-color:var(--accent);color:var(--accent)}
.brain-info .read{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:8px;font-weight:700;color:var(--accent);text-decoration:none}
.sec{font-size:15px;color:var(--muted);margin:0 0 12px}
@media (prefers-reduced-motion: reduce){.brain .ping{animation:none;display:none}.brain .lk,.brain .nd,.brain .nd text{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="back" href="../">← Trần Văn Tuấn</a>
    <button class="theme-btn" id="themeBtn" aria-label="Đổi giao diện sáng/tối">◐</button>
  </div>
  <h1>Sổ tay</h1>
  <p class="lead">Ghi chép những gì tôi học: AI, lập trình và cả chuyện trong cuộc sống. Mỗi bài là một trang riêng, đọc tốt trên điện thoại. Bấm vào một thẻ để bắt đầu.</p>
  <div class="filters" id="filters" role="group" aria-label="Lọc theo nhóm"></div>
  <div class="brain" id="brain" role="group" aria-label="Đồ thị liên kết giữa các bài. Danh sách đầy đủ ở bên dưới.">
    <div class="brain-ctl"><button type="button" data-z="in" aria-label="Phóng to">+</button><button type="button" data-z="out" aria-label="Thu nhỏ">−</button><button type="button" data-z="fit" aria-label="Xem toàn bộ">⤢</button></div>
  </div>
  <div class="brain-info" id="brainInfo" aria-live="polite"></div>
  <h2 class="sec">Tất cả bài</h2>
  <div class="grid" id="topics"></div>
  <p class="empty" id="empty" hidden>Nhóm này chưa có bài nào.</p>
  <footer>Bài mới sẽ được bổ sung dần.</footer>
</main>
<script>
(function(){
  // Add a new topic: create so-tay/<slug>/index.html, then add one entry here.
  // href is relative to this page: each topic lives in so-tay/<slug>/.
  // group: 'ai' | 'code' | 'life'. Entries without a group belong to 'ai'.
  var TOPICS=[
    {href:'rag/',icon:'📚',title:'RAG',sub:'Retrieval-Augmented Generation',desc:'Cách cho LLM trả lời dựa trên tài liệu của bạn: flow hai pha, embedding, retrieval, đánh giá và các kỹ thuật nâng cao.',tags:['Cốt lõi + flow','Không cần code','~3 tuần']},
    {href:'ai-agent/',icon:'🤖',title:'AI Agent',sub:'Agent loop, tool, memory',desc:'Agent hoạt động thế nào: vòng lặp suy nghĩ–hành động–quan sát, tool calling, memory, multi-agent, lỗi, an toàn, đánh giá. Có mô phỏng tương tác.',tags:['Cốt lõi + flow','Có mô phỏng','~3 tuần']},
    {href:'reranking/',icon:'🔀',title:'Reranking',sub:'Tìm nhanh rồi xếp hạng lại',desc:'Vì sao tìm nhanh rồi xếp hạng lại: bi-encoder và cross-encoder, chọn N/k, ngưỡng điểm, nDCG/MRR, kèm mô phỏng bấm Rerank thấy thứ hạng đổi.',tags:['Cross-encoder','Có mô phỏng','Đánh giá']},
    {href:'embedding-performance/',icon:'⚡',title:'Embedding Performance',sub:'Tìm đúng và chạy nhanh, nhẹ',desc:'Hai nghĩa của hiệu năng embedding: tìm đúng và chạy nhanh, nhẹ. Đo recall@k, tính bộ nhớ vector, Matryoshka, quantization, HNSW, đổi model.',tags:['Embedding','Có máy tính','Vector search']},
    {href:'governance/',icon:'🛡️',title:'AI Governance',sub:'Quản trị RAG/agent doanh nghiệp',desc:'Quản trị AI cho RAG/agent doanh nghiệp: vòng đời, phân quyền dữ liệu, rủi ro ↔ kiểm soát, xử lý sự cố, checklist sẵn sàng.',tags:['Rủi ro','Dữ liệu','Có checklist']},
    {href:'knowledge-base/',icon:'🗄️',title:'Knowledge Base',sub:'Kho tri thức cho AI',desc:'Kho tri thức cho AI: pipeline nạp dữ liệu, metadata, đồng bộ, quyền truy cập, knowledge graph và cách đo chất lượng. Có mô phỏng từng bước.',tags:['Ingestion','Metadata','Có mô phỏng']},
    {href:'hybrid-search/',icon:'🔎',title:'Hybrid Search',sub:'BM25 + vector + RRF',desc:'BM25 và vector chạy song song rồi trộn bằng RRF: vì sao cần, cách tính, tiếng Việt, mô phỏng tương tác và cách đánh giá.',tags:['BM25','RRF','Có mô phỏng']},
    {href:'harness/',icon:'🧰',title:'Agent Harness',sub:'Phần mềm bao quanh model',desc:'Harness là mọi thứ quanh model: vòng lặp agent, ghép context, tool, quyền, hook, sandbox, log. Đi qua 9 bước một coding agent sửa test.',tags:['Agent loop','Context','Có ví dụ từng bước']},
    {href:'multi-agent-agentic-rag/',icon:'🕸️',title:'Multi-agent & Agentic RAG',sub:'Khi nào cho agent tự quyết',desc:'Khi nào nên cho agent tự quyết cách tìm và chia việc cho nhiều agent: flow, mô phỏng token, CRAG, lỗi MAST, cách đo.',tags:['Multi-agent','Agentic RAG','Đánh đổi']},
    {href:'context-engineering/',icon:'🗂️',title:'Context Engineering',sub:'Quản lý thứ LLM nhìn thấy',desc:'Chọn, nén, ghi ra và cô lập context để agent chạy dài vẫn gọn, đúng và rẻ: compaction, tool search, sub-agent, prompt caching.',tags:['Context','Agent','Chi phí']},
    {href:'llm-evaluation/',icon:'🧪',title:'LLM Evaluation',sub:'Đo chất lượng RAG và agent',desc:'Xây golden set, chọn metric cho retrieval, câu trả lời và agent, hiệu chỉnh LLM-as-judge, nối eval offline với giám sát production.',tags:['Golden set','Metric RAG','LLM-as-judge']},
    {href:'query-transformation/',icon:'📝',title:'Query Transformation',sub:'Viết lại câu hỏi để tìm đúng',desc:'Biến câu hỏi người dùng thành truy vấn dễ tìm: rewrite, multi-query, decomposition, step-back, HyDE, routing, self-query và cái giá độ trễ.',tags:['RAG','Truy vấn','Retrieval']},
    {href:'llm-fundamentals/',icon:'🧠',title:'LLM Fundamentals',sub:'Token, context và sampling',desc:'Token, context window, sampling, thinking và vì sao LLM bịa: nền tảng để hiểu chi phí, giới hạn và lỗi của mọi hệ RAG và agent.',tags:['Token','Context window','Sampling']},
    {href:'prompt-engineering/',icon:'✍️',title:'Prompt Engineering',sub:'Viết chỉ dẫn cho LLM',desc:'Viết, đo và sửa prompt cho LLM: vai trò, ví dụ, thẻ XML, bám tài liệu, định dạng đầu ra, kèm mô phỏng lắp prompt và bộ eval.',tags:['Prompt','Few-shot','Eval']},
    {href:'tool-calling-structured-output/',icon:'🛠️',title:'Tool Calling & Structured Output',sub:'Để LLM hành động và trả JSON',desc:'Cách LLM gọi tool và trả JSON đúng schema: vòng gọi tool, strict mode, kiểm lời gọi, phân quyền, đánh giá cho agent doanh nghiệp.',tags:['Tool calling','JSON Schema','Agent']},
    {href:'model-context-protocol/',icon:'🔌',title:'Model Context Protocol',sub:'Cổng chung nối AI với hệ thống',desc:'Giao thức mở nối ứng dụng AI với dữ liệu và tool: host, client, server, flow từng bước, bảo mật, chi phí context, theo spec MCP 2026-07-28.',tags:['MCP','Bảo mật','Agent']},
    {href:'agent-memory/',icon:'📓',title:'Agent Memory',sub:'Nhớ qua nhiều phiên làm việc',desc:'Agent nhớ khách qua nhiều phiên: các loại memory, ghi–quản lý–đọc, chấm điểm truy hồi, quên và xóa, chống memory poisoning, cách đo.',tags:['Episodic/semantic','Truy hồi','Poisoning']},
    {href:'prompt-injection-guardrails/',icon:'🔐',title:'Prompt Injection & Guardrails',sub:'Chữ thành lệnh, phòng thủ nhiều lớp',desc:'Vì sao chữ đưa vào LLM thành lệnh: injection trực tiếp, gián tiếp, bộ ba nguy hiểm, phòng thủ nhiều lớp, phân quyền, phát hiện và đánh giá.',tags:['Bảo mật','Agent','RAG']},
    {href:'llm-observability/',icon:'📡',title:'LLM Observability',sub:'Trace, đo và gỡ lỗi LLM',desc:'Trace, span, sampling, đo độ trễ và chất lượng để tìm lỗi trong ứng dụng RAG và agent; theo quy ước GenAI của OpenTelemetry.',tags:['Tracing','Sampling','Giám sát']},
    {href:'llm-cost-optimization/',icon:'💰',title:'LLM Cost Optimization',sub:'Caching, định tuyến, batch, đo lường',desc:'Hóa đơn token của RAG và agent gồm gì, cách giảm bằng prompt caching, cắt context, định tuyến model, batch, và đo chi phí mỗi việc thành công.',tags:['Prompt caching','Định tuyến model','Batch']},
    {href:'fine-tuning-vs-rag/',icon:'⚖️',title:'Fine-tuning hay RAG',sub:'Chọn đúng cách dạy LLM',desc:'Chọn đúng giữa prompt, RAG và fine-tuning: lỗi thiếu kiến thức hay lỗi hành vi, SFT, DPO, RFT, LoRA, máy tính hòa vốn, rủi ro và cách đo.',tags:['Fine-tuning','RAG','LoRA']},
    {href:'graphrag/',icon:'🧬',title:'GraphRAG',sub:'RAG trên knowledge graph',desc:'GraphRAG cho RAG doanh nghiệp: LLM dựng knowledge graph, gom cộng đồng, tóm tắt sẵn; Local, Global, DRIFT search, chi phí index, khi nào nên dùng.',tags:['Knowledge graph','Global search','Chi phí index']},
    {href:'langchain/',icon:'🦜',title:'LangChain',sub:'Framework xây agent và LLM app',desc:'LangChain hôm nay: model, message, tool, structured output, RAG, create_agent và middleware; phần đã thành legacy; bản đồ với LangGraph, LangSmith.',tags:['LangChain','Agent','Framework']},
    {href:'langgraph/',icon:'🔁',title:'LangGraph',sub:'Điều phối agent có state, bền bỉ',desc:'Học LangGraph: state, node, edge, super-step, checkpoint, interrupt chờ người duyệt, time travel, memory và triển khai agent bền bỉ cho doanh nghiệp.',tags:['Agent','Orchestration','Human-in-the-loop']},
    {href:'langsmith/',icon:'🔬',title:'LangSmith',sub:'Trace, đánh giá, phát hành agent',desc:'Học LangSmith: trace, feedback, dataset, evaluator, experiment, online eval, prompt hub, Agent Server, retention và chi phí cho agent doanh nghiệp.',tags:['Observability','Evaluation','LLMOps']},
    {href:'llm-rubric-grading/',icon:'📋',title:'LLM Rubric Grading',sub:'Chấm điểm là tính năng sản phẩm',desc:'Dùng LLM chấm hồ sơ theo rubric ngay trong sản phẩm: mốc điểm, trích dẫn kiểm được, cache, người duyệt, đo kappa. Có phòng hiệu chỉnh tương tác.',tags:['Rubric','Trích dẫn','Có mô phỏng']},
    {href:'document-parsing-chunking/',icon:'✂️',title:'Document Parsing & Chunking',sub:'Đọc file và cắt chunk cho RAG',desc:'Biến PDF, Word, ảnh scan, Excel thành chunk tốt cho RAG: text layer và OCR, bố cục, bảng, chiến lược chunking, metadata, lỗi và cách đo.',tags:['OCR & bố cục','Chunking','Có mô phỏng']},
    {href:'long-document-extraction/',icon:'🧾',title:'Long Document Extraction',sub:'Tài liệu 100+ trang thành dữ liệu',desc:'Biến báo cáo kiểm toán, hợp đồng 100+ trang thành bản ghi có cấu trúc: schema, map-reduce, gộp bỏ trùng, checkpoint, sổ cái, trích dẫn kiểm được, F1.',tags:['Schema','Map-reduce','Có mô phỏng']},
    {href:'claude-code-tips/',icon:'💡',group:'code',title:'Claude Code tips',sub:'Chuyên mục mẹo dùng Claude Code',desc:'Chuyên mục nhiều bài: mỗi bài một mẹo dùng Claude Code hằng ngày, kèm lý do và file thật để chép. Bài đầu: CLAUDE.md global.',tags:['Claude Code','Chuyên mục','Có file mẫu']},
    {href:'multilingual-rag/',icon:'🌐',title:'RAG đa ngôn ngữ',sub:'Tài liệu, câu hỏi khác ngôn ngữ',desc:'Thiết kế RAG khi tài liệu, câu hỏi và câu trả lời khác ngôn ngữ: 4 kiến trúc, dịch máy và glossary, tiếng Việt, đo theo cặp ngôn ngữ, kèm mô phỏng.',tags:['Đa ngôn ngữ','Dịch máy','Có mô phỏng']}
  ];
  var grid=document.getElementById('topics');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var GROUPS=[['all','Tất cả'],['ai','AI'],['code','Lập trình'],['life','Cuộc sống']];
  var filters=document.getElementById('filters'),empty=document.getElementById('empty');
  TOPICS.forEach(function(t){
    var a=document.createElement('a');a.className='topic';a.href=t.href;a.dataset.group=t.group||'ai';
    a.innerHTML='<div class="icon" aria-hidden="true">'+t.icon+'</div><h2>'+esc(t.title)+'</h2><p><b>'+esc(t.sub)+'</b></p><p style="margin-top:6px">'+esc(t.desc)+'</p><div class="meta">'+t.tags.map(function(g){return '<span class="tag">'+esc(g)+'</span>'}).join('')+'</div><div class="go">Bắt đầu học →</div>';
    grid.appendChild(a);
  });
  function show(g){
    var n=0;
    [].forEach.call(grid.children,function(a){var on=g==='all'||a.dataset.group===g;a.hidden=!on;if(on)n++});
    [].forEach.call(filters.children,function(b){b.setAttribute('aria-pressed',b.dataset.g===g?'true':'false')});
    empty.hidden=n>0;
    if(graph)graph.filter(g);
  }
  GROUPS.forEach(function(g){
    var n=g[0]==='all'?TOPICS.length:TOPICS.filter(function(t){return (t.group||'ai')===g[0]}).length;
    var b=document.createElement('button');b.type='button';b.className='chip';b.dataset.g=g[0];b.textContent=g[1]+' ('+n+')';
    b.addEventListener('click',function(){show(g[0])});filters.appendChild(b);
  });
  // Graph view in the style of a second brain. Links are inferred from the notes themselves,
  // so a new TOPICS entry joins the graph with no extra data: two notes link when one names the
  // other's title, or both carry the same specific tag. A note with neither is tied to the note
  // whose wording overlaps most (rare words weigh more). The force layout follows d3-force's model.
  var graph=(function(){
    var box=document.getElementById('brain');if(!box||!TOPICS.length)return null;
    var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches,NS='http://www.w3.org/2000/svg';
    var GENERIC=/^(có |~|cốt lõi|không cần)/i;
    function low(s){return String(s||'').toLowerCase()}
    function rx(term){return new RegExp('(^|[^\\p{L}\\p{N}])'+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^\\p{L}\\p{N}])','iu')}
    var N=TOPICS.map(function(t,i){
      var m=/^(AI|LLM)\s+(.+)$/.exec(t.title);
      return {i:i,t:t,group:t.group||'ai',deg:0,nb:[],x:0,y:0,vx:0,vy:0,fx:null,fy:null,
        text:low(t.title+' '+t.sub+' '+t.desc+' '+t.tags.join(' ')),
        terms:[t.title].concat(m?[m[2]]:[]).map(rx),
        tags:t.tags.filter(function(g){return !GENERIC.test(g)}).map(low),
        words:low(t.sub+' '+t.desc).match(/[\p{L}\p{N}]{4,}/gu)||[]};
    });
    var seen={},L=[];
    function link(a,b){var k=a<b?a+'-'+b:b+'-'+a;if(a===b||seen[k])return;seen[k]=1;L.push({s:N[a],t:N[b]});N[a].deg++;N[b].deg++;N[a].nb.push(N[b]);N[b].nb.push(N[a])}
    N.forEach(function(a){N.forEach(function(b){
      if(a!==b&&(b.terms.some(function(r){return r.test(a.text)})||a.tags.some(function(g){return b.tags.indexOf(g)>=0})))link(a.i,b.i);
    })});
    var df={};N.forEach(function(n){n.ws={};n.words.forEach(function(w){n.ws[w]=1});Object.keys(n.ws).forEach(function(w){df[w]=(df[w]||0)+1})});
    N.forEach(function(a){
      if(a.deg)return;var best=-1,bs=0;
      N.forEach(function(b){if(a===b)return;var s=0;Object.keys(a.ws).forEach(function(w){if(b.ws[w])s+=1/df[w]});if(s>bs){bs=s;best=b.i}});
      if(best>=0)link(a.i,best);
    });
    // Every island of notes is tied into the largest one by its closest pair in wording.
    function sim(a,b){var s=0;Object.keys(a.ws).forEach(function(w){if(b.ws[w])s+=1/df[w]});return s}
    for(;;){
      var comp=N.map(function(){return -1}),cs=[];
      N.forEach(function(n){if(comp[n.i]>=0)return;var id=cs.length,st=[n],m=[];comp[n.i]=id;while(st.length){var x=st.pop();m.push(x);x.nb.forEach(function(y){if(comp[y.i]<0){comp[y.i]=id;st.push(y)}})}cs.push(m)});
      if(cs.length<2)break;
      cs.sort(function(a,b){return b.length-a.length});
      var bp=null,bs=-1;cs[1].forEach(function(a){cs[0].forEach(function(b){var v=sim(a,b);if(v>bs){bs=v;bp=[a.i,b.i]}})});
      link(bp[0],bp[1]);
    }

    // Force simulation (velocity Verlet with alpha decay, as in d3-force).
    var alpha=1,alphaTarget=0,DECAY=1-Math.pow(0.001,1/300),DIST=80,CHARGE=-320,PULL=0.1;
    N.forEach(function(n,i){var r=10*Math.sqrt(.5+i),a=i*Math.PI*(3-Math.sqrt(5));n.x=r*Math.cos(a);n.y=r*Math.sin(a)});
    L.forEach(function(l){l.str=1/Math.min(l.s.deg,l.t.deg);l.bias=l.s.deg/(l.s.deg+l.t.deg)});
    function tick(){
      alpha+=(alphaTarget-alpha)*DECAY;
      L.forEach(function(l){
        var s=l.s,t=l.t,x=t.x+t.vx-s.x-s.vx||1e-6,y=t.y+t.vy-s.y-s.vy||1e-6,d=Math.sqrt(x*x+y*y);
        d=(d-DIST)/d*alpha*l.str;x*=d;y*=d;t.vx-=x*l.bias;t.vy-=y*l.bias;s.vx+=x*(1-l.bias);s.vy+=y*(1-l.bias);
      });
      for(var i=0;i<N.length;i++)for(var j=i+1;j<N.length;j++){
        var a=N[i],b=N[j],x=b.x-a.x,y=b.y-a.y,d2=Math.max(1,x*x+y*y),w=CHARGE*alpha/d2;
        a.vx+=x*w;a.vy+=y*w;b.vx-=x*w;b.vy-=y*w;
      }
      N.forEach(function(n){
        n.vx-=n.x*PULL*alpha;n.vy-=n.y*PULL*alpha;
        if(n.fx!=null){n.x=n.fx;n.vx=0}else n.x+=n.vx*=0.6;
        if(n.fy!=null){n.y=n.fy;n.vy=0}else n.y+=n.vy*=0.6;
      });
    }
    for(var s=0;s<300;s++)tick();

    // Drawing in screen coordinates so labels keep their size at every zoom level.
    var svg=document.createElementNS(NS,'svg');svg.setAttribute('aria-hidden','true');box.insertBefore(svg,box.firstChild);
    function mk(tag,cls,p){var e=document.createElementNS(NS,tag);if(cls)e.setAttribute('class',cls);p.appendChild(e);return e}
    var gl=mk('g','',svg),gn=mk('g','',svg),last=N[N.length-1];
    L.forEach(function(l){l.el=mk('line','lk',gl)});
    var hubCut=N.map(function(n){return n.deg}).sort(function(a,b){return b-a})[Math.min(7,N.length-1)];
    N.forEach(function(n){
      n.r=5+Math.sqrt(n.deg)*2.2;
      n.g=mk('g','nd '+n.group+(n.deg>=Math.max(hubCut,3)?' hub':''),gn);
      if(n===last){var p=mk('circle','ping',n.g);p.setAttribute('r',n.r)}
      n.c=mk('circle','',n.g);n.c.setAttribute('r',n.r);
      n.l=mk('text','',n.g);n.l.textContent=n.t.title;n.l.setAttribute('y',n.r+15);n.l.setAttribute('text-anchor','middle');
    });
    var W=0,H=0,k=1,tx=0,ty=0,grow=reduce?1:0;
    function fit(){
      var b=box.getBoundingClientRect();W=b.width;H=b.height;svg.setAttribute('viewBox','0 0 '+W+' '+H);
      var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;N.forEach(function(n){x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y)});
      k=Math.min((W-60)/Math.max(1,x1-x0),(H-90)/Math.max(1,y1-y0),1.6);tx=W/2-(x0+x1)/2*k;ty=H/2-(y0+y1)/2*k;
    }
    function draw(){
      var cx=W/2,cy=H/2;
      N.forEach(function(n){
        var p=Math.min(1,Math.max(0,(grow-n.delay)/0.55)),e=1-Math.pow(1-p,3);
        n.sx=cx+(n.x*k+tx-cx)*e;n.sy=cy+(n.y*k+ty-cy)*e;
        n.g.setAttribute('transform','translate('+n.sx.toFixed(1)+','+n.sy.toFixed(1)+') scale('+(0.2+0.8*e).toFixed(3)+')');
        n.g.style.opacity=e<1?e:'';
      });
      labels();
      L.forEach(function(l){var e=l.el;e.setAttribute('x1',l.s.sx.toFixed(1));e.setAttribute('y1',l.s.sy.toFixed(1));e.setAttribute('x2',l.t.sx.toFixed(1));e.setAttribute('y2',l.t.sy.toFixed(1));e.style.opacity=grow<1?Math.max(0,(grow-0.5)*2):''});
    }
    // Labels go in priority order (focused note, its neighbours, then by link count) and skip any spot already taken.
    var focusNode=null;
    function labels(){
      var f=focusNode,order=N.slice().sort(function(a,b){return rank(b)-rank(a)}),boxes=[];
      function rank(n){return (n===f?1e4:0)+(f&&f.nb.indexOf(n)>=0?1e3:0)+n.deg}
      order.forEach(function(n){
        var want=n===f||(f?f.nb.indexOf(n)>=0:(n.deg>=3||k>=1.45)),w=n.t.title.length*6.6+6,x=n.sx-w/2,y=n.sy+n.r+3,ok=want&&x>2&&x+w<W-2&&y+16<H;
        for(var i=0;ok&&i<boxes.length;i++){var b=boxes[i];if(x<b[2]&&x+w>b[0]&&y<b[3]&&y+16>b[1])ok=false}
        if(ok)boxes.push([x,y,x+w,y+16]);
        n.g.classList.toggle('lab',ok);
      });
    }
    var maxDeg=Math.max.apply(null,N.map(function(n){return n.deg}));
    N.forEach(function(n){n.delay=0.45*(1-n.deg/maxDeg)});
    fit();draw();

    // Entrance: hubs bloom first, then their neighbours.
    if(!reduce){var t0=0;requestAnimationFrame(function step(ts){t0=t0||ts;grow=Math.min(1,(ts-t0)/1300);draw();if(grow<1)requestAnimationFrame(step)})}

    // Live simulation only while something is being dragged or settling.
    var running=false;
    function loop(){if(running)return;running=true;requestAnimationFrame(function f(){tick();draw();if(alpha>0.005||alphaTarget>0)requestAnimationFrame(f);else running=false})}

    // Highlight and selection.
    var info=document.getElementById('brainInfo'),sel=null,hover=null,group='all';
    function paint(){
      var f=sel||hover;focusNode=f;box.classList.toggle('focus',!!f);
      N.forEach(function(n){
        var on=!!f&&(n===f||f.nb.indexOf(n)>=0);
        n.g.classList.toggle('hi',on);n.g.classList.toggle('sel',n===sel);
        n.g.classList.toggle('off',group!=='all'&&n.group!==group);
      });
      labels();
      L.forEach(function(l){l.el.classList.toggle('hi',!!f&&(l.s===f||l.t===f));l.el.classList.toggle('off',group!=='all'&&(l.s.group!==group||l.t.group!==group))});
    }
    function esc2(s){return esc(s)}
    function select(n){
      sel=n;paint();
      if(!n){info.innerHTML=summary;return}
      info.innerHTML='<h3>'+n.t.icon+' '+esc2(n.t.title)+'</h3><p class="sub">'+esc2(n.t.sub)+'</p>'+
        '<p class="rel-k">Nối với '+n.nb.length+' bài:</p><div class="rel">'+n.nb.map(function(m){return '<button type="button" data-i="'+m.i+'">'+m.t.icon+' '+esc2(m.t.title)+'</button>'}).join('')+'</div>'+
        '<a class="read" href="'+n.t.href+'">Đọc bài <span aria-hidden="true">→</span></a>';
    }
    var summary='<p class="sum"><b>'+N.length+' bài, '+L.length+' liên kết.</b> Chạm vào một chấm để xem bài và những bài nối với nó. Kéo chấm để xếp lại, dùng nút + − để phóng to.</p>';
    info.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(b)select(N[+b.dataset.i])});
    select(null);

    // Pointer: drag a node, pan the background, tap to select.
    var drag=null,pan=null,down=null;
    function local(e){var b=svg.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}}
    function hit(p){var best=null,bd=22*22;N.forEach(function(n){var dx=n.sx-p.x,dy=n.sy-p.y,d=dx*dx+dy*dy;if(d<Math.max(bd,n.r*n.r)){bd=d;best=n}});return best}
    svg.addEventListener('pointerdown',function(e){
      var p=local(e),n=hit(p);down={x:p.x,y:p.y,n:n,moved:false};
      if(n){drag=n;svg.setPointerCapture(e.pointerId);n.fx=n.x;n.fy=n.y;e.preventDefault()}
      else if(e.pointerType==='mouse'){pan={x:p.x,y:p.y,tx:tx,ty:ty};svg.setPointerCapture(e.pointerId)}
    });
    svg.addEventListener('pointermove',function(e){
      var p=local(e);
      if(down&&Math.hypot(p.x-down.x,p.y-down.y)>5)down.moved=true;
      if(drag&&down.moved){drag.fx=(p.x-tx)/k;drag.fy=(p.y-ty)/k;alphaTarget=0.3;if(alpha<0.3)alpha=0.3;loop()}
      else if(pan){tx=pan.tx+p.x-pan.x;ty=pan.ty+p.y-pan.y;draw()}
      else if(e.pointerType==='mouse'&&!down){var h=hit(p);if(h!==hover){hover=h;svg.style.cursor=h?'pointer':'grab';paint()}}
    });
    function up(e){
      if(down&&!down.moved)select(down.n&&down.n!==sel?down.n:null);
      if(drag){drag.fx=drag.fy=null;alphaTarget=0;loop()}
      drag=pan=down=null;
    }
    svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',function(){if(drag){drag.fx=drag.fy=null;alphaTarget=0;loop()}drag=pan=down=null});
    svg.addEventListener('pointerleave',function(){if(hover){hover=null;paint()}});

    // Zoom: buttons everywhere, pinch on a trackpad (ctrl + wheel).
    function zoom(f,px,py){px=px==null?W/2:px;py=py==null?H/2:py;var nk=Math.max(0.4,Math.min(4,k*f));tx=px-(px-tx)*nk/k;ty=py-(py-ty)*nk/k;k=nk;draw();paint()}
    box.querySelector('[data-z="in"]').addEventListener('click',function(){zoom(1.3)});
    box.querySelector('[data-z="out"]').addEventListener('click',function(){zoom(1/1.3)});
    box.querySelector('[data-z="fit"]').addEventListener('click',function(){fit();draw();paint()});
    svg.addEventListener('wheel',function(e){if(!e.ctrlKey)return;e.preventDefault();var p=local(e);zoom(Math.exp(-e.deltaY*0.01),p.x,p.y)},{passive:false});
    var rt=0;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){fit();draw();paint()},150)});

    return {filter:function(g){group=g;if(sel&&g!=='all'&&sel.group!==g)select(null);else paint()}};
  })();
  show('all');
  var root=document.documentElement;
  document.getElementById('themeBtn').addEventListener('click',function(){
    var cur=root.getAttribute('data-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    var next=cur==='dark'?'light':'dark';root.setAttribute('data-theme',next);try{localStorage.setItem('rag-theme',next)}catch(e){}
  });
})();
</script>
</body>
</html>
